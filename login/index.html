<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="preload" as="image" href="/assets/logo-black.png" fetchpriority="high">
<meta name="theme-color" content="#0f0f0f">
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
<title data-i18n="loginPageTitle">تسجيل الدخول — صدى</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#0f0f0f;
  --ink-soft:#65676b;
  --ink-faint:#8a8d91;
  --line:#dbdbdb;
  --bg:#fafafa;
  --panel:#ffffff;
  --accent:#1a73e8;
  --danger:#d93025;
  --success:#1e7a45;
  --input-bg:#fafafa;
  --btn-text:#ffffff;
  --btn-bg:var(--ink);
  --focus-border:var(--ink);
  --msg-error-bg:#fdecea;
  --msg-success-bg:#e9f7ef;
  --card-shadow:none;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#f2f2f3; --ink-soft:#a9abaf; --ink-faint:#797c81; --line:#2a2b30;
    --bg:#0a0a0c; --panel:#17181c; --accent:#6ea8f5; --danger:#f28b82; --success:#81c995;
    --input-bg:#101114;
    --btn-text:#ffffff;
    --btn-bg:linear-gradient(135deg,#6ea8f5,#4b7fd1);
    --focus-border:#6ea8f5;
    --msg-error-bg:rgba(242,139,130,.14);
    --msg-success-bg:rgba(129,201,149,.14);
    --card-shadow:0 12px 34px rgba(0,0,0,.55);
  }
}
*{box-sizing:border-box;}
html,body{height:100%;margin:0;}
body{
  font-family:"IBM Plex Sans Arabic","Segoe UI",Tahoma,sans-serif;
  background:var(--bg);
  color:var(--ink);
  min-height:100vh;
  display:flex;
  flex-direction:column;
}
a{color:var(--accent);text-decoration:none;}
a:hover{text-decoration:underline;}
button{font-family:inherit;}

.topbar{ padding:22px 24px; display:flex; align-items:center; justify-content:space-between; }
.topbar-spacer{ width:76px; }
.logo{ display:flex; align-items:center; gap:10px; font-weight:700; font-size:19px; color:var(--ink); }
.logo-mark{ height:29px; width:auto; display:block; flex-shrink:0; }
.lang-switch{
  display:flex; align-items:center; gap:6px; border:1px solid var(--line); background:transparent;
  color:var(--ink-soft); border-radius:20px; padding:7px 14px; font-size:13px; font-weight:600;
  cursor:pointer; font-family:inherit; transition:border-color .15s ease, color .15s ease;
}
.lang-switch:hover{ border-color:var(--ink-faint); color:var(--ink); }
.lang-switch svg{ width:15px; height:15px; }

.wrap{ flex:1; display:flex; align-items:center; justify-content:center; padding:16px 16px 60px; }

.card{
  width:100%; max-width:380px;
  background:var(--panel);
  border:1px solid var(--line);
  border-radius:12px;
  padding:36px 32px;
  box-shadow:var(--card-shadow);
}
.below-card{
  width:100%; max-width:380px;
  text-align:center; margin-top:16px;
  border:1px solid var(--line); border-radius:12px;
  padding:16px; font-size:14px;
}
.below-card.switcher{ border:none; padding:0; }
.above-card{
  width:100%; max-width:380px;
  text-align:center; margin-bottom:20px;
  border:1px solid var(--line); border-radius:12px;
  padding:16px; font-size:14px;
}
.above-card.switcher{ border:none; padding:0; }
.stack{ display:flex; flex-direction:column; align-items:center; }

@media (max-width:480px){
  .card{ border:none; padding:20px 6px; }
  .below-card{ border:none; }
  .above-card{ border:none; }
}

.card h1{ font-size:20px; font-weight:700; margin:0 0 6px; text-align:center; }
.card .sub{ font-size:13.5px; color:var(--ink-soft); text-align:center; margin:0 0 26px; }

.field{ margin-bottom:14px; }
.field label{ display:block; font-size:13px; font-weight:500; color:var(--ink); margin-bottom:6px; }
.field .input-shell{
  border:1px solid var(--line); border-radius:8px; background:var(--input-bg);
  transition:border-color .15s ease, background .15s ease;
  position:relative;
}
.field .input-shell:focus-within{ border-color:var(--focus-border); background:var(--panel); }
.field .input-shell.field-error{ border-color:var(--danger); }
.field .input-shell.field-error:focus-within{ border-color:var(--danger); }
.field input{
  width:100%; border:none; outline:none; background:transparent;
  padding:12px 14px; font-size:14.5px; font-family:inherit; color:var(--ink); border-radius:8px;
}
.field input::placeholder{ color:#a8abaf; }

.toggle-eye{ position:absolute; top:50%; transform:translateY(-50%); background:none; border:none; cursor:pointer; color:#8a8d91; padding:4px; display:flex; }
html[dir="rtl"] .toggle-eye{ left:10px; right:auto; }
html[dir="ltr"] .toggle-eye{ right:10px; left:auto; }
html[dir="rtl"] #password{ padding-left:38px; }
html[dir="ltr"] #password{ padding-right:38px; }

.row-between{ display:flex; justify-content:space-between; align-items:center; font-size:13px; margin:2px 0 20px; }

.btn-primary{
  width:100%; border:none; border-radius:8px; padding:12.5px;
  font-weight:700; font-size:14.5px; color:var(--btn-text); background:var(--btn-bg);
  cursor:pointer; transition:opacity .15s ease;
}
.btn-primary:hover{ opacity:.88; }
.btn-primary[disabled]{ opacity:.5; cursor:default; }
.btn-primary{ display:flex; align-items:center; justify-content:center; gap:8px; }
.spinner{
  display:none; width:15px; height:15px; border-radius:50%;
  border:2px solid color-mix(in srgb, var(--btn-text) 35%, transparent); border-top-color:var(--btn-text);
  animation:spin .7s linear infinite;
}
.spinner.show{ display:inline-block; }
@keyframes spin{ to{ transform:rotate(360deg); } }

.form-msg{ display:none; font-size:13px; padding:10px 12px; border-radius:8px; margin-bottom:16px; text-align:center; }
.form-msg.shake{ animation:sada-shake .35s ease; }
@keyframes sada-shake{
  10%,90%{ transform:translateX(-1px); }
  20%,80%{ transform:translateX(2px); }
  30%,50%,70%{ transform:translateX(-4px); }
  40%,60%{ transform:translateX(4px); }
}
.form-msg.show{ display:block; }
.form-msg.error{ background:var(--msg-error-bg); color:var(--danger); }
.form-msg.success{ background:var(--msg-success-bg); color:var(--success); }

.captcha-wrap{
  display:none; justify-content:center; width:100%;
  margin:4px 0 18px;
  animation:captchaIn .25s ease;
}
.captcha-wrap.show{ display:flex; }
@keyframes captchaIn{ from{ opacity:0; transform:translateY(-6px); } to{ opacity:1; transform:translateY(0); } }

footer{ text-align:center; padding:18px; font-size:12px; color:var(--ink-faint); }

</style>
<link rel="stylesheet" href="/assets/transitions.css?v=20260801i">

</head>
<body>
<script>document.body.classList.add('sada-pre');</script>

  <div class="topbar">
    <button class="topbar-back" id="backBtn" type="button" aria-label="رجوع" data-i18n-aria="backBtnLabel">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <a href="/" class="logo">
      <span data-i18n="brand">صدى</span>
      <img src="/assets/logo-black.png" alt="" class="logo-mark" width="30" height="29" loading="eager" fetchpriority="high" decoding="async">
    </a>
    <button class="lang-switch" id="langBtn" type="button">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c2.5 2.7 3.8 6 3.8 9s-1.3 6.3-3.8 9c-2.5-2.7-3.8-6-3.8-9s1.3-6.3 3.8-9z"/></svg>
      <span id="langBtnLabel">EN</span>
    </button>
  </div>

  <div class="wrap">
    <div class="stack">
      <div class="above-card switcher">
        <div class="radio-inputs">
          <label class="radio">
            <input type="radio" name="auth" checked>
            <span class="radio-item" data-i18n="login">تسجيل الدخول</span>
          </label>
          <label class="radio">
            <input type="radio" name="auth" onclick="sadaNavigate('/signup')">
            <span class="radio-item" data-i18n="signup">إنشاء حساب</span>
          </label>
        </div>
      </div>
      <form class="card" id="loginForm" novalidate>
        <h1 data-i18n="loginTitle">تسجيل الدخول</h1>
        <p class="sub" data-i18n="loginSub">أدخل بياناتك للمتابعة إلى حسابك</p>

        <div class="form-msg" id="formMsg"></div>

        <div class="field floating">
          <div class="input-shell">
            <input id="identifier" name="identifier" type="text" inputmode="text" autocomplete="username" placeholder=" ">
            <label for="identifier" data-i18n="identifierLabel">البريد الإلكتروني أو اسم المستخدم</label>
          </div>
        </div>

        <div class="field floating">
          <div class="input-shell">
            <input id="password" name="password" type="password" placeholder=" ">
            <label for="password" data-i18n="passwordLabel">كلمة المرور</label>
            <button type="button" class="toggle-eye" aria-label="إظهار كلمة المرور" onclick="togglePwd(this)">
              <svg class="eye-closed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a18.36 18.36 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 7 11 7a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
              <svg class="eye-open" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" style="display:none"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/><circle cx="12" cy="12" r="3"/></svg>
            </button>
          </div>
        </div>

        <div class="row-between">
          <label class="remember" for="remember">
            <span class="cbx">
              <input type="checkbox" id="remember">
              <span class="flip">
                <span class="front"></span>
                <span class="back">
                  <svg viewBox="0 0 16 14" height="14" width="16"><path d="M2 8.5L6 12.5L14 1.5"></path></svg>
                </span>
              </span>
            </span>
            <span data-i18n="remember">تذكرني</span>
          </label>
          <a href="/forgot" data-i18n="forgotLink">نسيت كلمة المرور؟</a>
        </div>

        <!-- حاوية Cloudflare Turnstile: تظهر تلقائيًا فقط بعد عدة محاولات فاشلة -->
        <div class="captcha-wrap" id="turnstileContainer"></div>

        <button class="btn-primary btn-glow" type="submit" id="submitBtn">
          <span class="glow"></span><span class="glow-hover"></span>
          <span class="stroke"></span><span class="stroke-hover"></span>
          <span class="fill"></span>
          <span class="btn-content"><span class="spinner" id="submitSpinner"></span><span id="submitLabel" data-i18n="loginBtn">تسجيل الدخول</span></span>
        </button>
      </form>
    </div>
  </div>

  <footer>© صدى — جميع الحقوق محفوظة</footer>

  <!-- Cloudflare Turnstile: يتحمّل دائمًا (خفيف)، لكن العنصر لا يظهر إلا عند الحاجة -->
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
  <script src="/js/supabase-config.js"></script>
  <script src="/js/supabase-client.js"></script>
  <script>
    window.addEventListener('pageshow', function(e){ if (e.persisted) { window.location.reload(); } });

    // ===== Cloudflare Turnstile =====
    // المفتاح يُقرأ من js/supabase-config.js (المفتاح العلني فقط — آمن بالواجهة).
    // التحقق الحقيقي من Turnstile يصير عند Supabase نفسه (Authentication →
    // Attack Protection) عبر Secret Key تحطه هناك، مو بأي كود هنا.
    const TURNSTILE_SITE_KEY = window.SADA_CONFIG.TURNSTILE_SITE_KEY;

    let captchaRequired = true;    // Supabase يتحقق من الكابتشا بكل محاولة دخول
    let captchaWidgetId = null;
    let captchaToken = '';

    function showCaptchaWidget() {
      const box = document.getElementById('turnstileContainer');
      box.classList.add('show');
      captchaToken = '';

      const tryRender = () => {
        if (!window.turnstile) { setTimeout(tryRender, 200); return; } // السكربت لسا يحمّل
        if (captchaWidgetId === null) {
          captchaWidgetId = window.turnstile.render('#turnstileContainer', {
            sitekey: TURNSTILE_SITE_KEY,
            theme: 'auto',
            size: 'flexible',
            language: 'auto',
            callback: (token) => { captchaToken = token; },
            'expired-callback': () => { captchaToken = ''; },
            'error-callback': () => { captchaToken = ''; }
          });
        } else {
          window.turnstile.reset(captchaWidgetId); // يولّد رمز جديد لمحاولة جديدة
        }
      };
      tryRender();
    }
    // ===== نهاية إعداد Turnstile =====

    function togglePwd(btn){
      const input = btn.previousElementSibling;
      const willShow = input.type === "password";
      input.type = willShow ? "text" : "password";
      btn.querySelector(".eye-closed").style.display = willShow ? "none" : "";
      btn.querySelector(".eye-open").style.display = willShow ? "" : "none";
      btn.setAttribute("aria-label", willShow ? "إخفاء كلمة المرور" : "إظهار كلمة المرور");
    }

    const form = document.getElementById('loginForm');
    const msg = document.getElementById('formMsg');
    const submitBtn = document.getElementById('submitBtn');
    const submitLabel = document.getElementById('submitLabel');
    const submitSpinner = document.getElementById('submitSpinner');
    showCaptchaWidget();

    function isValidIdentifier(v){
      if (v.indexOf('@') !== -1) return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
      return /^[A-Za-z0-9_\u0600-\u06FF]{3,20}$/.test(v);
    }

    const savedEmail = document.cookie.split('; ').find(c => c.startsWith('remember_email='));
    if (savedEmail) {
      document.getElementById('identifier').value = decodeURIComponent(savedEmail.split('=')[1]);
      document.getElementById('remember').checked = true;
    }

    const emailShell = document.getElementById('identifier').closest('.input-shell');
    const passwordShell = document.getElementById('password').closest('.input-shell');

    let lastErrorVibrateAt = 0;
    function vibrateOnError(){
      const now = Date.now();
      if (now - lastErrorVibrateAt < 1500) return; // تجاهل الأخطاء المتكررة بسرعة عشان ما يصير اهتزاز مزعج متواصل
      lastErrorVibrateAt = now;
      if ('vibrate' in navigator) { try { navigator.vibrate(200); } catch (e) {} }
      msg.classList.remove('shake'); void msg.offsetWidth; msg.classList.add('shake');
    }
    function showMsg(text, type){ msg.textContent = text; msg.className = 'form-msg show ' + type; if (type === 'error') vibrateOnError(); }
    function clearFieldErrors(){ emailShell.classList.remove('field-error'); passwordShell.classList.remove('field-error'); }
    function markFieldError(shell, input){ shell.classList.add('field-error'); input.focus(); }
    [document.getElementById('identifier'), document.getElementById('password')].forEach(el => {
      el.addEventListener('input', () => el.closest('.input-shell').classList.remove('field-error'));
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.className = 'form-msg';
      clearFieldErrors();
      const identifier = document.getElementById('identifier').value.trim();
      const password = document.getElementById('password').value;
      const remember = document.getElementById('remember').checked;

      if (!identifier) { showMsg(SadaI18n.t('errEnterIdentifier'), 'error'); markFieldError(emailShell, document.getElementById('identifier')); return; }
      if (!isValidIdentifier(identifier)) { showMsg(SadaI18n.t('errValidIdentifier'), 'error'); markFieldError(emailShell, document.getElementById('identifier')); return; }
      if (!password) { showMsg(SadaI18n.t('errEnterPassword'), 'error'); markFieldError(passwordShell, document.getElementById('password')); return; }

      if (captchaRequired && !captchaToken) {
        showMsg(SadaI18n.t('captchaFailed') || 'فشل التحقق الأمني، يرجى المحاولة مرة أخرى.', 'error');
        showCaptchaWidget();
        return;
      }

      submitBtn.disabled = true; submitLabel.textContent = SadaI18n.t('loginLoading'); submitSpinner.classList.add('show');

      try {
        // اسم المستخدم/بريد → لازم بريد فعلي عشان Supabase Auth يتحقق منه
        const email = await SadaAuth.resolveEmail(identifier);
        if (!email) {
          emailShell.classList.add('field-error');
          showMsg(SadaI18n.t('loginFailed') || 'البيانات غير صحيحة.', 'error');
          submitBtn.disabled = false; submitLabel.textContent = SadaI18n.t('loginBtn'); submitSpinner.classList.remove('show');
          if (window.turnstile && captchaWidgetId !== null) { window.turnstile.reset(captchaWidgetId); captchaToken = ''; }
          return;
        }

        const { data, error } = await SadaAuth.client.auth.signInWithPassword({
          email, password,
          options: { captchaToken }
        });

        if (!error && data.user) {
          if (remember) {
            document.cookie = 'remember_email=' + encodeURIComponent(identifier) + ';max-age=15552000;path=/';
          } else {
            document.cookie = 'remember_email=;max-age=0;path=/';
          }
          showMsg(SadaI18n.t('loginSuccess') || 'تم تسجيل الدخول', 'success');
          const profile = await SadaAuth.getProfile(data.user.id);
          window.location.href = (profile && profile.username) ? '/feed/' : '/choose-username/';
        } else {
          emailShell.classList.add('field-error');
          passwordShell.classList.add('field-error');
          const emailNotConfirmed = error && /confirm/i.test(error.message || '');
          if (emailNotConfirmed) {
            showMsg((SadaI18n.t('emailNotVerified') || 'لازم تفعّل بريدك أولًا') + SadaI18n.t('redirectingSuffix'), 'error');
            sessionStorage.setItem('sada_pending_email', email);
            setTimeout(() => { window.location.href = '/verify/'; }, 1800);
          } else {
            showMsg(SadaI18n.t('loginFailed') || 'البيانات غير صحيحة.', 'error');
            submitBtn.disabled = false; submitLabel.textContent = SadaI18n.t('loginBtn'); submitSpinner.classList.remove('show');
          }
          if (window.turnstile && captchaWidgetId !== null) { window.turnstile.reset(captchaWidgetId); captchaToken = ''; }
        }
      } catch (err) {
        showMsg(SadaI18n.t('networkError'), 'error');
        submitBtn.disabled = false; submitLabel.textContent = SadaI18n.t('loginBtn'); submitSpinner.classList.remove('show');
      }
    });
  </script>
    <script src="/assets/i18n.js?v=20260801i"></script>
  <script src="/assets/transitions.js?v=20260801i"></script>
</body>
